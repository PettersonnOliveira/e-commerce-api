services:
  ecommerce-mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ${DB_USERNAME:-ecommerce_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # Vinculado estritamente ao loopback para nao expor a porta publicamente na internet
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce-network

  ecommerce-api:
    build: .
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      # Restrito ao loopback — acesso público somente via Caddy
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://ecommerce-mysql:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-ecommerce_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      ecommerce-mysql:
        condition: service_healthy
    networks:
      - ecommerce-network

  caddy:
    image: caddy:2-alpine
    container_name: ecommerce-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - ecommerce-api
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data:
  caddy_data:
  caddy_config: